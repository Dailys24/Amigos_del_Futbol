    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

      </div>

  </header>

    <!-- TARJETAS DE LÍDERES (CALCULADAS AUTOMÁTICAMENTE) -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Mejor Goleador -->
      <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl p-4 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Mejor Goleador</span>
          <span class="text-lg">⚽</span>
        </div>
        <div id="leader-scorer-name" class="text-xl font-bold text-white mt-2">—</div>
        <div id="leader-scorer-stat" class="text-sm font-medium text-emerald-400 mt-0.5">—</div>
      </div>

      <!-- Mejor Arquero -->
      <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl p-4 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Mejor Arquero</span>
          <span class="text-lg">🧤</span>
        </div>
        <div id="leader-gk-name" class="text-xl font-bold text-white mt-2">—</div>
        <div id="leader-gk-stat" class="text-sm font-medium text-sky-400 mt-0.5">—</div>
      </div>

      <!-- Mejor Viejo Crack -->
      <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl p-4 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Mejor Viejo Crack</span>
          <span class="text-lg">🎖️</span>
        </div>
        <div id="leader-vc-name" class="text-xl font-bold text-white mt-2">—</div>
        <div id="leader-vc-stat" class="text-sm font-medium text-amber-400 mt-0.5">—</div>
      </div>
    </section>

    <!-- NAVEGACIÓN DE PESTAÑAS -->
    <nav class="flex flex-wrap gap-2 border-b border-zinc-800 pb-3" id="tabs">
      <button data-tab="goleadores" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 transition">
        ⚽ Goleadores
      </button>
      <button data-tab="arqueros" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        🧤 Arqueros
      </button>
      <button data-tab="viejosCrack" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        🎖️ Viejos Crack
      </button>
      <button data-tab="finanzas" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        💰 Finanzas y Cancha
      </button>
    </nav>

      <div id="table-info" class="px-4 py-3 bg-zinc-900/90 border-b border-zinc-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs text-zinc-400">

          <tbody id="table-body" class="divide-y divide-zinc-800/60 text-sm"></tbody>
        </table>
      </div>
    </section>

  </main>

    function initDashboard() {
      document.getElementById("header-subtitle").textContent = DASHBOARD_DATA.tituloFecha;

      // Ordenar y calcular líderes
      const sortedScorers = [...DASHBOARD_DATA.goleadores].sort((a, b) => b.goles - a.goles || a.pj - b.pj);
      const sortedGKs = [...DASHBOARD_DATA.arqueros].sort((a, b) => b.puntaje - a.puntaje);
      const sortedVC = [...DASHBOARD_DATA.viejosCrack]
        .map(p => ({ ...p, puntaje: p.pj * 5 + p.goles * 0.5 }))
        .sort((a, b) => b.puntaje - a.puntaje);

      if (sortedScorers.length) {
        document.getElementById("leader-scorer-name").textContent = sortedScorers[0].nombre;
        document.getElementById("leader-scorer-stat").textContent = `${sortedScorers[0].goles} Goles Totales`;

      if (sortedGKs.length) {
        document.getElementById("leader-gk-name").textContent = sortedGKs[0].nombre;
        document.getElementById("leader-gk-stat").textContent = `${sortedGKs[0].puntaje} Puntos Anuales`;
      }
      if (sortedVC.length) {
        document.getElementById("leader-vc-name").textContent = sortedVC[0].nombre;
        document.getElementById("leader-vc-stat").textContent = `${sortedVC[0].puntaje.toFixed(1)} Puntos`;
      }

      renderTable();
    }

    function getRankBadge(index) {
      if (index === 0) return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 font-bold text-xs border border-amber-500/40">1</span>`;
      if (index === 1) return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-zinc-400/20 text-zinc-300 font-bold text-xs border border-zinc-400/40">2</span>`;
      if (index === 2) return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-orange-700/30 text-orange-400 font-bold text-xs border border-orange-600/40">3</span>`;
      return `<span class="text-zinc-500 font-mono text-xs pl-2">${index + 1}</span>`;
    }

    function renderTable() {
      const thead = document.getElementById("table-head");
      const tbody = document.getElementById("table-body");
      const formulaEl = document.getElementById("table-formula");
      const countEl = document.getElementById("table-count");

      const filterFn = (item) => item.nombre.toLowerCase().includes(searchQuery.toLowerCase());

      if (currentTab === "goleadores") {
        const list = [...DASHBOARD_DATA.goleadores]
          .sort((a, b) => b.goles - a.goles || a.pj - b.pj)
          .map((item, idx) => ({ ...item, rank: idx }))
          .filter(filterFn);

        formulaEl.textContent = "Ranking ordenado por Goles Totales • Promedio = Goles / Partidos Jugados";
        countEl.textContent = `${list.length} jugadores`;

        thead.innerHTML = `
          <tr>
            <th class="py-3 px-4 w-14">#</th>
            <th class="py-3 px-4">Jugador</th>
            <th class="py-3 px-4 text-right">PJ</th>
            <th class="py-3 px-4 text-right">Goles</th>
            <th class="py-3 px-4 text-right">Promedio</th>
          </tr>`;

        tbody.innerHTML = list.map(p => {
          const prom = p.pj > 0 ? (p.goles / p.pj).toFixed(2) : "0.00";
          return `
            <tr class="hover:bg-zinc-800/40 transition">
              <td class="py-3 px-4">${getRankBadge(p.rank)}</td>
              <td class="py-3 px-4 font-medium text-zinc-100">${p.nombre}</td>
              <td class="py-3 px-4 text-right text-zinc-400">${p.pj}</td>
              <td class="py-3 px-4 text-right font-bold text-emerald-400">${p.goles}</td>
              <td class="py-3 px-4 text-right text-zinc-300 font-mono text-xs">${prom}</td>
            </tr>`;
        }).join("");

      } else if (currentTab === "arqueros") {
        const list = [...DASHBOARD_DATA.arqueros]
          .sort((a, b) => b.puntaje - a.puntaje)
          .map((item, idx) => ({ ...item, rank: idx }))
          .filter(filterFn);

        formulaEl.textContent = "Fórmula: 15 puntos base menos los goles recibidos en cada fecha";

            <th class="py-3 px-4 w-14">#</th>

          </tr>`;

        tbody.innerHTML = list.map(p => `
          <tr class="hover:bg-zinc-800/40 transition">
            <td class="py-3 px-4">${getRankBadge(p.rank)}</td>
            <td class="py-3 px-4 font-medium text-zinc-100">${p.nombre}</td>
            <td class="py-3 px-4 text-right text-zinc-400">${p.pj}</td>
            <td class="py-3 px-4 text-right text-zinc-300">${p.goles}</td>
            <td class="py-3 px-4 text-right font-bold text-amber-400">${p.puntaje.toFixed(1)}</td>
          </tr>`
        ).join("");

      } else if (currentTab === "finanzas") {
        const list = DASHBOARD_DATA.finanzas.filter(filterFn);
        const totalAbonos = list.reduce((acc, item) => acc + item.abono, 0);

        formulaEl.textContent = `Registro de partidos pendientes y abonos • Total abonos visibles: ${formatCLP(totalAbonos)}`;
        countEl.textContent = `${list.length} registros`;

        thead.innerHTML = `
          <tr>
            <th class="py-3 px-4">Jugador</th>
            <th class="py-3 px-4 text-right">Partidos $2.500</th>
            <th class="py-3 px-4 text-right">Partidos $3.000</th>
            <th class="py-3 px-4 text-right">Abono Aportado</th>
          </tr>`;

        tbody.innerHTML = list.map(p => {
          const abonoClass = p.abono > 0 ? "text-emerald-400 font-semibold" : "text-zinc-500";
          return `
            <tr class="hover:bg-zinc-800/40 transition">
              <td class="py-3 px-4 font-medium text-zinc-100">${p.nombre}</td>
              <td class="py-3 px-4 text-right ${p.p2500 > 0 ? 'text-amber-300 font-medium' : 'text-zinc-600'}">${p.p2500}</td>
              <td class="py-3 px-4 text-right ${p.p3000 > 0 ? 'text-rose-300 font-medium' : 'text-zinc-600'}">${p.p3000}</td>
              <td class="py-3 px-4 text-right ${abonoClass}">${formatCLP(p.abono)}</td>
            </tr>`;
        }).join("");
      }
    }

    // Eventos de pestañas
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b => {
          b.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition";
        });
        btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 transition";
        renderTable();
      });
    });

    // Evento de búsqueda
    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderTable();
    });

    initDashboard();
  </script>
</body>
</html>
