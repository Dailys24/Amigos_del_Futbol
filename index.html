<!-- NAVEGACIÓN DE PESTAÑAS (CON SCROLL HORIZONTAL EN MÓVIL) -->
    <nav class="flex gap-2 overflow-x-auto pb-2 border-b border-zinc-800" id="tabs">
      <button data-tab="goleadores" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 transition">
        ⚽ Goleadores
      </button>
      <button data-tab="arqueros" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        🧤 Arqueros
      </button>
      <button data-tab="viejosCrack" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        🎖️ Viejos Crack
      </button>
      <button data-tab="finanzas" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        💰 Finanzas y Cancha
      </button>
      <button data-tab="videos" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200 transition">
        📺 Videos
      </button>
    </nav>

    <!-- TABLA ACTIVA -->
    <section id="table-section" class="bg-zinc-900/50 border border-zinc-800 rounded-xl overflow-hidden shadow-xl">
      <div id="table-info" class="px-4 py-3 bg-zinc-900/90 border-b border-zinc-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs text-zinc-400">
        <span id="table-formula"></span>
        <span id="table-count" class="font-medium text-zinc-300"></span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[480px]">
          <thead id="table-head" class="bg-zinc-950/70 text-xs uppercase tracking-wider text-zinc-400 border-b border-zinc-800"></thead>
          <tbody id="table-body" class="divide-y divide-zinc-800/60 text-sm"></tbody>
        </table>
      </div>
    </section>

    <!-- APARTADO DE VIDEOS (PLAYLIST DE YOUTUBE) -->
    <section id="videos-section" class="hidden bg-zinc-900/50 border border-zinc-800 rounded-xl overflow-hidden shadow-xl">
      <div class="px-4 py-3 bg-zinc-900/90 border-b border-zinc-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold text-white">Partidos y Jugadas en YouTube</h2>
          <p id="video-season-label" class="text-xs text-zinc-400"></p>
        </div>
        <a
          id="youtube-external-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/15 text-rose-400 border border-rose-500/30 hover:bg-rose-500/25 transition shrink-0"
        >
          <span>Abrir playlist en YouTube</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      <div class="p-4">
        <div id="video-player-wrapper" class="aspect-video w-full rounded-xl overflow-hidden bg-zinc-950 border border-zinc-800">
          <iframe
            id="youtube-iframe"
            class="w-full h-full"
            title="Reproductor de playlist de partidos"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
        <p id="video-empty-msg" class="hidden py-10 text-center text-sm text-zinc-500">
          Aún no hay una playlist de YouTube configurada para esta temporada.
        </p>
      </div>
    </section>
